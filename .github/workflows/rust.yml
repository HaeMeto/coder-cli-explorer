name: build-and-release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Build .deb / .rpm inside a Debian 12 (bookworm) container so the produced
  # packages are linked against a low glibc (2.36) and run on Debian 12+ and
  # Ubuntu, unlike building on ubuntu-latest (glibc 2.39) which fails on older
  # distros with "GLIBC_2.xx not found".
  linux-deb-rpm:
    name: Linux .deb/.rpm (Debian 12 compatible)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config libssl-dev zlib1g-dev libutempter-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Install cargo-deb and cargo-generate-rpm
        run: |
          cargo install cargo-deb
          cargo install cargo-generate-rpm

      - name: Build .deb and .rpm
        run: |
          mkdir -p release
          cargo deb --no-build --output release/coder-${{ env.RELEASE_VERSION }}-x86_64-unknown-linux-gnu.deb
          cargo generate-rpm -o release/coder-${{ env.RELEASE_VERSION }}-x86_64-unknown-linux-gnu.rpm

      - name: Verify glibc requirement is compatible with Debian 12 (<= 2.36)
        run: |
          latest=$(objdump -T target/release/coder | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "Max glibc required: $latest"
          if [ "$latest" != "GLIBC_2.34" ] && [ "$latest" != "GLIBC_2.35" ] && [ "$latest" != "GLIBC_2.36" ]; then
            echo "error: binary requires $latest which is newer than Debian 12 (glibc 2.36)"
            exit 1
          fi

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --latest --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGES.md

      - name: Upload the .deb / .rpm releases
        uses: svenstaro/upload-release-action@v2
        with:
          file: release/coder-${{ env.RELEASE_VERSION }}-x86_64-unknown-linux-gnu.*
          file_glob: true
          overwrite: true
          tag: ${{ github.ref }}
          release_name: "coder v${{ env.RELEASE_VERSION }}"
          body: ${{ steps.git-cliff.outputs.content }}
          repo_token: ${{ secrets.RELEASE_TOKEN }}

  # Plain binary tarballs/zips for every major OS/arch.
  binaries:
    name: Publish for ${{ matrix.build.OS }} (${{ matrix.build.TARGET }})
    runs-on: ${{ matrix.build.OS }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - OS: ubuntu-latest
            TOOLCHAIN: stable
            TARGET: x86_64-unknown-linux-gnu
          - OS: ubuntu-latest
            TOOLCHAIN: stable
            TARGET: aarch64-unknown-linux-gnu
            EXTRA_DEPS: "gcc-aarch64-linux-gnu"
          - OS: windows-2022
            TOOLCHAIN: stable
            TARGET: x86_64-pc-windows-msvc
          - OS: windows-2022
            TOOLCHAIN: stable
            TARGET: aarch64-pc-windows-msvc
          - OS: macos-14
            TOOLCHAIN: stable
            TARGET: aarch64-apple-darwin
          - OS: macos-13
            TOOLCHAIN: stable
            TARGET: x86_64-apple-darwin
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev zlib1g-dev \
            ${{ matrix.build.EXTRA_DEPS }}

      - name: Configure cross C linker (Linux aarch64)
        if: matrix.build.TARGET == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.build.TARGET }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.build.TARGET }}

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p coder-${{ env.RELEASE_VERSION }}
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/${{ matrix.build.TARGET }}/release/coder.exe coder-${{ env.RELEASE_VERSION }}/
          else
            cp target/${{ matrix.build.TARGET }}/release/coder coder-${{ env.RELEASE_VERSION }}/
          fi
          cp README.md LICENSE* coder-${{ env.RELEASE_VERSION }}/ 2>/dev/null || true

      - name: Create release artifacts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip coder-${{ env.RELEASE_VERSION }}-${{ matrix.build.TARGET }}.zip coder-${{ env.RELEASE_VERSION }}/
          else
            tar -czvf coder-${{ env.RELEASE_VERSION }}-${{ matrix.build.TARGET }}.tar.gz coder-${{ env.RELEASE_VERSION }}/
            shasum -a 512 coder-${{ env.RELEASE_VERSION }}-${{ matrix.build.TARGET }}.tar.gz \
              > coder-${{ env.RELEASE_VERSION }}-${{ matrix.build.TARGET }}.tar.gz.sha512
          fi

      - name: Upload the binary releases
        uses: svenstaro/upload-release-action@v2
        with:
          file: coder-${{ env.RELEASE_VERSION }}-${{ matrix.build.TARGET }}*
          file_glob: true
          overwrite: true
          tag: ${{ github.ref }}
          release_name: "coder v${{ env.RELEASE_VERSION }}"
          repo_token: ${{ secrets.RELEASE_TOKEN }}

  # Best-effort static musl build for Alpine and very old-glibc distros.
  # continue-on-error: openssl-sys + arboard/x11rb cross-compilation to musl is
  # fragile and should never block the whole release if it fails.
  linux-musl:
    name: Linux musl (x86_64 Alpine/static)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${GITHUB_REF:11}" >> "$GITHUB_ENV"

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build (static, bundled OpenSSL)
        run: |
          export OPENSSL_STATIC=1
          export PKG_CONFIG_ALLOW_CROSS=1
          cargo build --release --locked --target x86_64-unknown-linux-musl
        env:
          OPENSSL_STATIC: 1
          OPENSSL_DIR: /usr
          PKG_CONFIG_ALLOW_CROSS: 1

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p coder-${{ env.RELEASE_VERSION }}
          cp target/x86_64-unknown-linux-musl/release/coder coder-${{ env.RELEASE_VERSION }}/
          tar -czvf coder-${{ env.RELEASE_VERSION }}-x86_64-unknown-linux-musl.tar.gz coder-${{ env.RELEASE_VERSION }}/
          shasum -a 512 coder-${{ env.RELEASE_VERSION }}-x86_64-unknown-linux-musl.tar.gz \
            > coder-${{ env.RELEASE_VERSION }}-x86_64-unknown-linux-musl.tar.gz.sha512

      - name: Upload the musl release
        uses: svenstaro/upload-release-action@v2
        with:
          file: coder-${{ env.RELEASE_VERSION }}-x86_64-unknown-linux-musl.*
          file_glob: true
          overwrite: true
          tag: ${{ github.ref }}
          release_name: "coder v${{ env.RELEASE_VERSION }}"
          repo_token: ${{ secrets.RELEASE_TOKEN }}
