[package]
name = "coder"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Lightweight Terminal IDE like VSCode. Supports mouse clicks, git, autocomplete, LSP and more."
repository = "https://github.com/eminfedar/coder"
authors = ["Emin Fedar <eminfedar@gmail.com>"]

[profile.release]
strip = true # Automatically strip symbols from the binary.
lto = true

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-widget-list = "0.15"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "time", "io-util"] }
ropey = "1.6"
syntect = "5.2"
git2 = "0.20"
portable-pty = "0.9"
vt100 = "0.15"
ignore = "0.4"
regex = "1"
unicode-width = "0.2"
anyhow = "1"
thiserror = "2"
arboard = "3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Completion scripts are generated by build.rs into target/completions/.
[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/coder", dest = "/usr/bin/coder", mode = "755" },
    { source = "assets/coder.desktop", dest = "/usr/share/applications/coder.desktop", mode = "644" },
    { source = "assets/coder.svg", dest = "/usr/share/icons/hicolor/scalable/apps/coder.svg", mode = "644" },
    { source = "target/completions/coder.bash", dest = "/usr/share/bash-completion/completions/coder", mode = "644" },
    { source = "target/completions/_coder", dest = "/usr/share/zsh/site-functions/_coder", mode = "644" },
    { source = "target/completions/coder.fish", dest = "/usr/share/fish/vendor_completions.d/coder.fish", mode = "644" },
]

[package.metadata.deb]
assets = [
    ["target/release/coder", "usr/bin/coder", "755"],
    ["assets/coder.desktop", "usr/share/applications/coder.desktop", "644"],
    ["assets/coder.svg", "usr/share/icons/hicolor/scalable/apps/coder.svg", "644"],
    ["target/completions/coder.bash", "usr/share/bash-completion/completions/coder", "644"],
    ["target/completions/_coder", "usr/share/zsh/vendor-completions/_coder", "644"],
    ["target/completions/coder.fish", "usr/share/fish/vendor_completions.d/coder.fish", "644"],
]
